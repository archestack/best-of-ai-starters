name: Opt out
description: Maintainers can ask for their project to be removed. Applied within 24 hours.
title: "Opt out: "
labels: [opt-out]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub repository URL
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I maintain this project. The bot accepts an opt-out from the repository owner, a public member of its organization, or one of its top five contributors; anyone else gets a manual check.
          required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason (optional)
