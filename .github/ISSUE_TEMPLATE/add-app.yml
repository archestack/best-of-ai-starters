name: Add a project
description: Suggest a project for this list. We check it and reply here.
title: "Add: "
labels: [submission]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub repository URL
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - chat-apps
        - rag-search
        - agents
        - agent-ui
        - voice-realtime
        - mcp-apps
        - saas-with-ai
        - app-builders
        - editors-workflows
        - cloud-reference
        - api-backends
        - mobile-extensions
        - coding-agents
        - editors
        - skills-plugins
        - dev-mcp
        - code-review
        - design-to-code
        - prompts
        - backends
        - deploy
        - not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What does it do, or what do you get when you clone it?
      description: Concrete capability, not a slogan. The entry is written from the README anyway; this helps the reviewer.
    validations:
      required: true
  - type: input
    id: demo
    attributes:
      label: Live demo URL (optional)
  - type: dropdown
    id: relation
    attributes:
      label: Your relation to the project
      options:
        - maintainer
        - contributor
        - user
        - none
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: It helps build software with AI, it is a starter or boilerplate you fork, or it is part of the stack you ship on.
          required: true
        - label: It has an open-source license file.
          required: true
